[project]
name = "fleet-routing"
version = "0.1.0"
description = "Next-day routing for a regional freight fleet: zone demand forecasts size the roster, a misroute-risk model reorders loads, OR-Tools builds the routes"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "ortools>=9.11",
    "matplotlib>=3.9",
]

[project.scripts]
fleet-routing = "fleet_routing.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_routing"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# X and y follow the usual matrix notation for features and targets.
"src/fleet_routing/forecast.py" = ["N803", "N806"]
"src/fleet_routing/risk.py" = ["N803", "N806"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# OR-Tools' SWIG bindings warn on import under Python 3.11; nothing to act on.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
