slides:
  - id: "01"
    title: "The industry"
    image: slides/slide-01.jpg
    time: "0.0-7.2 s"
    composition: "compositions/s01-context.html"
    text:
      - "01 · THE INDUSTRY"
      - "Each evening, tomorrow's orders have to become routes."
      - "Who plans delivery routes every night, and the four problems they run into."
      - "WHO LIVES WITH THIS · Regional freight & 3PL carriers · Parcel & retail distribution · Grocery & e-commerce fleets"
      - "01 Thousands of stops, routed by hand or a simple heuristic — Every evening, against a deadline"
      - "02 Delivery windows and truck capacity collide — A tighter route can break a customer's slot"
      - "03 Misrouted and failed deliveries — Each one costs a second trip and a customer"
      - "04 Peak weeks outgrow the fleet — Drivers are booked days ahead, from a forecast"
      - "THIS PROJECT tackles all four, end to end · forecast → book → route → measure"
    assumptions: [A-16]
    illustrative: ["The whole slide is context; no repo figures."]
    change: "Edit the chips (#ctx-c1..3) and cards (#ctx-k1..4) in compositions/s01-context.html."
  - id: "02"
    title: "This project"
    image: slides/slide-02.jpg
    time: "6.8-12.0 s"
    composition: "compositions/s02-hook.html"
    text:
      - "02 · THIS PROJECT"
      - "The project in one line: a big fleet, thousands of orders, one night to plan them."
      - "300 trucks, 4 depots. Up to 2,800 orders a day. One evening to route them."
      - "every stop has a delivery window · trailer capacity + shift limits · >5% of peak shipments misrouted"
      - "Misrouted = sent to the wrong depot, truck or door, so it needs a second delivery."
    assumptions: [A-01, A-06, A-11]
    illustrative: ["Depot rings in the background are decoration."]
    change: "Headline spans #hook-l1..l3 and chips #hook-f1..f3 in compositions/s02-hook.html; fleet/depots come from config.py FULL profile."
  - id: "03"
    title: "How it works (white chapter, slide A)"
    image: slides/slide-03.jpg
    time: "11.7-19.7 s"
    composition: "compositions/explainer.html (CONFIG.blocks, CONFIG.groups, CONFIG.loop)"
    text:
      - "03 · HOW IT WORKS"
      - "From orders to routes"
      - "Read left to right: forecast demand, book drivers, flag risky stops, then the optimizer builds the routes."
      - "ORDERS stops + time windows → [EVERY MONDAY: FORECAST how busy is next week? → BOOK DRIVERS trucks per depot] → [EVERY EVENING: RISK CHECK which stops may go wrong? → OPTIMIZER OR-Tools, 6 s per depot] → ROUTES OUT ✓ windows kept ✓ fewer km ✓ fewer trucks"
      - "build, score, improve (loop over the optimizer)"
    assumptions: [A-04, A-07, A-13]
    illustrative: ["Icons and colours are a visual language, not data.", "'every evening' = each order day is dispatched the next day (A-12)."]
    change: "Edit CONFIG in compositions/explainer.html; badge truth comes from routing_summary.csv (F-11)."
  - id: "04"
    title: "The key idea (white chapter, slide B)"
    image: slides/slide-04.jpg
    time: "19.7-26.7 s"
    composition: "compositions/explainer.html (#ex-b ...)"
    text:
      - "04 · THE KEY IDEA"
      - "Pricing risk into the route"
      - "One truck, four stops. The optimizer weighs extra km against the chance a late stop gets misrouted."
      - "Every stop gets a misroute risk — predicted from past shipments, before dispatch"
      - "Later stops are riskier — they sit deeper in the trailer"
      - "The optimizer charges extra km for a risky stop placed late — so it moves that stop forward"
      - "ONE TRUCK · DELIVERY ORDER: DEPOT, !, A, B, C (1st..4th). Risk priced in: the risky stop goes first, at the cost of a small detour."
      - "Replay: −4.2% misroutes for +4.0% km. A weak lever; the position effect is an assumption to test on real routes."
    assumptions: [A-02, A-03, A-15]
    illustrative: ["The A/B/C/! demo is schematic; it mirrors tests/test_risk_pricing_moves_a_risky_stop_to_the_front, not a real route."]
    change: "Markup under #ex-b in compositions/explainer.html; the footnote figures are F-14 and F-15."
  - id: "05"
    title: "Architecture"
    image: slides/slide-05.jpg
    time: "26.4-39.2 s"
    composition: "compositions/s03-architecture.html"
    text:
      - "05 · ARCHITECTURE"
      - "Three models feed one dispatcher. One replay scores everything."
      - "Each box is a file in the repo. Data flows left to right; one replay scores every plan the same way."
      - "data.py · seeded generator: Zone demand (2 yrs × 40 zones), Shipments (200k past shipments), Orders (24k · time windows)"
      - "forecast.py Demand forecast (XGBoost vs ETS · SARIMA) → simulate.py Driver roster (trucks per depot-day)"
      - "risk.py Misroute-risk model (XGBoost · chance of misroute) · later stops are riskier"
      - "routing.py OR-Tools route solver (capacity · windows · shift · + misroute risk priced in km · solve budget 6.0 s) → Routes (per depot-day) → replay() Replay (km · on-time · misroutes)"
      - "undelivered → rollover, age +1 · risk.py Address check (call top 5% before loading)"
      - "Legend: data · models · optimizer · evaluation · risk lever"
    assumptions: [A-01, A-02, A-04, A-09, A-12]
    illustrative: ["Packets moving along the wires are decoration; the solve-budget bar fills in real seconds."]
    change: "Node boxes (#n-*) and the wires array in compositions/s03-architecture.html."
  - id: "06"
    title: "The system running"
    image: slides/slide-06a.jpg
    image2: slides/slide-06b.jpg
    time: "38.8-53.4 s"
    composition: "compositions/s04-routes.html; assets/map-sweep.png, assets/map-ortools.png (from outputs/full/route_map.png via tools/darkmap.py)"
    text:
      - "06 · THE SYSTEM RUNNING"
      - "Same depot, same peak day, two dispatchers."
      - "Each line is one truck's route out of the depot (white square). Less line = fewer km."
      - "Depot 3 · dispatch 2025-12-09 · ○ high predicted misroute risk"
      - "Sweep baseline: fill trucks by direction: 104 trucks · 11,368 km | OR-Tools solver, risk-priced: 93 trucks · 8,574 km | −24.6% km"
      - "The whole peak week, all four depots."
      - "Total road km every truck drove that week, sweep vs plain OR-Tools. Fewer km is better."
      - "PEAK WEEK · ALL 4 DEPOTS · 13,554 ORDERS — 140,683 → 109,607 km, −22.1% (sweep vs OR-Tools bars)"
    assumptions: [A-03, A-04, A-05, A-12, A-14]
    illustrative: ["Maps are the repo's real route_map.png, colour-inverted to dark; the legend is redrawn because the original legend was removed from the image.", "The map compares sweep with risk-priced OR-Tools; the peak-week counter compares sweep with plain OR-Tools."]
    change: "Map captions (#routes-cap-l/r, #routes-chip) and counter (#routes-wk-num, #routes-bar) in compositions/s04-routes.html; maps come from make run → outputs/full/route_map.png."
  - id: "07"
    title: "End-user value (white)"
    image: slides/slide-07.jpg
    time: "53.1-66.1 s"
    composition: "compositions/value.html (SHEET block injected by tools/inject_sheet.py)"
    text:
      - "07 · END-USER VALUE"
      - "What the dispatcher gets"
      - "Each row is one truck's day: leave time, stops, first and last arrival, km driven, back at the depot."
      - "DISPATCH SHEET · DEPOT 3 · 2025-12-09 — columns TRUCK, DRIVER, OUT, STOPS, SHIPMENTS, FIRST, LAST, KM, BACK"
      - "T-013 Driver 01 06:00 12 S013242 +11 08:00 14:00 179 15:21"
      - "T-025 Driver 02 06:00 15 S013393 +14 08:00 15:11 198 15:54"
      - "T-031 Driver 03 06:00 14 S012500 +13 08:00 16:39 127 17:57"
      - "T-035 Driver 04 06:00 12 S011211 +11 08:00 16:45 152 17:58"
      - "T-039 Driver 05 06:00 12 S010859 +11 08:00 14:48 115 15:36"
      - "T-054 Driver 06 06:00 13 S011185 +12 08:00 16:44 111 17:37"
      - "+ 87 more trucks on this sheet · ✓ 93 trucks · 910 orders, all inside their delivery windows · 8,413 km"
      - "DEPOT · LOADING DOCK · TODAY'S ROUTES"
      - "Every truck leaves with a loaded, ordered stop list and arrival times. No evening of routing by hand."
    assumptions: [A-03, A-04, A-05, A-06, A-10, A-11]
    illustrative: ["Driver 01-06 are placeholders (no real people).", "Dispatcher figure, loading dock, truck drawings, 3 boxes per truck (stands in for 12-15 shipments) and driving speed are illustrative.", "The 4 animated trucks (T-025, T-031, T-035, T-054) were chosen because their routes spread in different directions; their stop positions and order are real, scaled to fit the panel.", "'No evening of routing by hand' is framing from the README problem statement, not a measured result."]
    change: "Re-run tools/export_dispatch_sheet.py, then tools/inject_sheet.py (--rows / --animate pick the trucks); layout in compositions/value.html."
  - id: "08"
    title: "Results"
    image: slides/slide-08.jpg
    time: "65.8-74.6 s"
    composition: "compositions/s05-results.html (stats array)"
    text:
      - "08 · RESULTS · TWO REPLAYED WEEKS"
      - "Fewer km, fewer trucks, enough drivers booked."
      - "Changes are OR-Tools vs the sweep. WAPE = forecast error as a share of real orders. Lower is better on all four."
      - "OPTIMIZER −22.1% road km, peak week · 140,683 → 109,607"
      - "OPTIMIZER −8.1% truck-days, peak week · 1,457 → 1,339"
      - "FORECAST 0.208 zone-demand WAPE, XGBoost · ETS 0.260 · naive 0.344"
      - "FORECAST 8.7% peak depot-days short of trucks · ETS forecast: 53.8%"
      - "4 depots · 300 trucks · 40 zones · every routing number comes from one replay that re-drives the finished routes"
    assumptions: [A-04, A-05, A-10, A-12, A-13, A-15]
    illustrative: ["Mini bars under each number are drawn to the same ratio (after / before)."]
    change: "The stats array and card text in compositions/s05-results.html."
  - id: "09"
    title: "Lesson and fix"
    image: slides/slide-09.jpg
    time: "74.2-83.2 s"
    composition: "compositions/s06-twist.html"
    text:
      - "09 · LESSON AND FIX"
      - "Tighter routes misroute more. So I priced the risk into routing."
      - "Peak week, all 4 depots. Misroute rate = share of shipments sent to the wrong place; lower is better."
      - "THE LESSON · The fewest-km plan misroutes the most · Misroute rate · dashed line = sweep baseline"
      - "Sweep baseline (140,683 km) 4.41% · Plain OR-Tools (109,607 km · fewest) 4.58% TRAP"
      - "Packing more stops per truck puts more parcels deep in the trailer. Quiet week too: 3.07% → 3.16%."
      - "THE FIX, IN THE REPO · Charge km for a risky stop placed late · One misroute priced at · km vs unpriced OR-Tools"
      - "150 km (+4.0% km) 4.39% PICKED · 500 km (+7.7% km) 4.32% · 2,000 km (+18.4% km) 4.33%"
      - "routing.py moves risky stops forward, and a test checks it. Higher prices buy almost nothing more."
      - "PAYOFF · Misroutes 4.58% → 4.39%, under the sweep's 4.41%, with 19.0% fewer km · trailer effect simulated"
    assumptions: [A-02, A-03, A-04, A-05, A-12, A-15]
    illustrative: ["Bar lengths: one shared scale in both panels, 5% misroute rate = 260 px track; the dashed marker sits at the sweep's 4.41%.", "Colour: every bar is neutral grey except the shipped 150 km setting (mint, PICKED); coral is used only for the TRAP label and the lesson tag.", "'More parcels deep in the trailer' is the mechanism written into the generator (A-02), not a measured fact about real trailers."]
    change: "Rows #twist-l1..l2 and #twist-r1..r3 (bar widths are inline styles, 52 px per 1%) and #twist-payoff in compositions/s06-twist.html."
  - id: "10"
    title: "End card"
    image: slides/slide-10.jpg
    time: "82.8-87.2 s"
    composition: "compositions/s07-end.html"
    text:
      - "10 · OPEN SOURCE · MIT · RUNS ON A LAPTOP"
      - "fleet-routing-cvrp"
      - "github.com/kavya2693/fleet-routing-cvrp"
      - "OR-Tools · XGBoost · statsmodels · Python"
      - "$ make run   # 300 trucks, 4 depots, ~18 min"
      - "One command rebuilds every table the numbers in this video come from."
    assumptions: [A-15]
    illustrative: ["Faded route map in the background is the OR-Tools panel of route_map.png."]
    change: "Text in compositions/s07-end.html."

caveats:
  - "Map-day km: the slide shows 8,574 km (route_map.png title, from make run). The single-day re-run used for slide 07 gives 8,412.7 km. OR-Tools stops on wall-clock time, so repeated runs differ slightly (README 'Known limitations': 87,715 vs 88,698 km on the quiet week)."
  - "−24.6% (slide 06) is derived from the two plot titles; the repo does not store per-depot-day routes for make run."
  - "The map (slide 06) compares sweep with risk-priced OR-Tools; the peak-week counter (slides 06, 08) compares sweep with plain OR-Tools."
  - "'Up to 2,800 orders a day' (slide 02) is the busiest day in the data (2,785 orders, rounded up); the README's 'closer to 2,700' describes a typical peak day."
  - "On-time 100% / 'windows kept' is true by construction: OR-Tools treats windows as hard and rolls stops over instead (A-07)."
  - "Slide 01 statements are general industry knowledge (A-16)."
  - "Route-position misroute risk is a mechanism written into the generator (A-02); its real size must be measured on real route histories before the routing-side misroute numbers mean anything (README 'Known limitations')."
  - "Driver names on slide 07 are placeholders."
  - "Slide 09 no longer shows the address-check comparison: the XGBoost misroute model ties a two-line supervisor rule at picking the top 5% of consignees to call before loading (16.4% vs 16.6% fewer peak misroutes; ROC-AUC 0.645 against a 0.647 ceiling). The repo implements no fix for that tie; its next step (train the risk model on fixable faults only) is in README 'Insights and learning'. The README still reports the full table in 'The result' (items 4-5) and 'At a glance: What didn't win', and outputs/full/address_checks.csv and risk_scores.csv hold the numbers."
  - "Slide 09's payoff (4.58% → 4.39%) is real replay output, but the effect it corrects (later stops are riskier) is written into the generator; README 'Known limitations' names this as the biggest gap. Pricing risk is a weak lever: higher prices (500 km, 2,000 km) cut misroutes only to 4.32-4.33% for +7.7% to +18.4% km."
  - "The 0.094 log-odds-per-stop position estimate is no longer printed on slide 05 (shown in plain words as 'later stops are riskier'); it remains in outputs/full/results.json and the README."

