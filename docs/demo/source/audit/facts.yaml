  - {id: F-33, slides: ["07"], label: "Orders on the sheet", shown: "910 orders", type: direct, source: "demo assets/dispatch_sheet.json; data/full/dispatch_orders.csv", key: "orders on 2025-12-08 for depot 3", formula: "-",
