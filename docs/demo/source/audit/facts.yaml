  import re as _re
  def sheet_rows_match():
      """The SHEET block injected in value.html must equal the exported dispatch sheet."""
      html = T('demo:compositions/value.html')
      m = _re.search(r"const SHEET = (\{.*?\}); /\* SHEET:END", html, _re.S)
      sheet = json.loads(m.group(1))
      src = {t['vehicle']: t for t in J('demo:assets/dispatch_sheet.json')['trucks']}
      for r in sheet['rows']:
          t = src[r['vehicle']]
          for k in ('stops', 'km', 'return', 'first_eta', 'last_eta', 'depart'):
              if r[k] != t[k]:
                  return False
          if r['ids'] != [s['order_id'] for s in t['sequence']]:
              return False
      return [r['vehicle'] for r in sheet['rows']] == [12, 24, 30, 34, 38, 53]
