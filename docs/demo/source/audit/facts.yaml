  - {id: F-25, slides: ["06"], label: "OR-Tools (risk-priced) trucks on the map day", shown: "93 trucks", type: direct, source: "outputs/full/route_map.png (right panel title); re-run in demo assets/dispatch_sheet.json", key: "trucks_used", formula: "-",
     check: {expr: "J('demo:assets/dispatch_sheet.json')['trucks_used']", fmt: "{:d}", expect: "93"}}
