# Audit facts for the fleet-routing-cvrp demo video.
# Read by docs/demo/source/tools/build_audit_report.py.
#
# Check expressions are Python, evaluated with these helpers (paths relative to the repo root;
# a "demo:" prefix means relative to the demo project folder):
#   R(path) -> pandas DataFrame from CSV      J(path) -> parsed JSON
#   row(path, **eq) -> the single CSV row matching all equalities (a pandas Series)
#   T(path) -> file text                      grep(path, regex) -> True/False
# A check passes when fmt.format(value) == expect (or, with fmt "bool", when value is True).

project:
  name: fleet-routing-cvrp
  title: "fleet-routing-cvrp: demo video audit report"
  repo_url: https://github.com/kavya2693/fleet-routing-cvrp
  repo_dir: ../../../..          # paths are relative to this file
  demo_dir: ..
  demo_display: docs/demo/source
  out_dir: ../..
  video: docs/demo/demo.mp4
  video_duration_s: 87.2
  outputs_dir: outputs/full
  venv_python: .venv/bin/python
  version_packages: [ortools, xgboost, pandas, numpy, statsmodels, sklearn]
  regenerate:
    - "make run                                   # outputs/full/*.csv, results.json, route_map.png (~18 min)"
    - "python3 docs/demo/source/tools/darkmap.py outputs/full/route_map.png docs/demo/source/assets"
    - "PYTHONPATH=src .venv/bin/python docs/demo/source/tools/export_dispatch_sheet.py docs/demo/source/assets/dispatch_sheet.json"
    - "python3 docs/demo/source/tools/inject_sheet.py docs/demo/source/assets/dispatch_sheet.json docs/demo/source/compositions/value.html --rows 12,24,30,34,38,53 --animate 24,30,34,53"
    - "cd docs/demo/source && npx --yes hyperframes@0.8.156 check && npx --yes hyperframes@0.8.156 render -f 30 -q looks -o renders/fleet-routing-cvrp-master.mp4 && cd -"
    - "ffmpeg -y -i docs/demo/source/renders/fleet-routing-cvrp-master.mp4 -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart -an docs/demo/demo.mp4"
    - "python3 docs/demo/source/tools/build_audit_report.py docs/demo/source/audit/facts.yaml   # stills, checks, MD/DOCX/PDF"
  seeds: {profile: full, seed: 7, risk_model_seed: 7}
  run_time: "results.json runtime_seconds = 1063 s (about 17.7 min) for make run on the author's laptop"

assumptions:
  - id: A-01
    statement: "All data is synthetic, produced by a seeded generator sized to the production problem (300 trucks, 4 depots, 40 zones, 2 years of demand, 200,000 historical shipments). The production data is proprietary."
    source: "src/fleet_routing/config.py:32-46 (FULL profile, seed=7); scripts/generate_data.py; README 'The data'"
    figures: [F-03, F-04, F-05, F-16, F-17, F-18]
    all_figures: true
    edit: ["src/fleet_routing/config.py (FULL profile)", "src/fleet_routing/data.py"]
    rerun: ["make data", "make run"]
  - id: A-02
    statement: "Misroute risk rises with route position: the generator adds 0.09 log-odds per stop past the first, capped at 15 stops. The pipeline re-estimates it from history (0.094)."
    source: "src/fleet_routing/data.py:238-241 (position_logit); README 'Known limitations' (biggest gap)"
    figures: [F-13, F-14, F-15, F-57, F-58, F-59, F-60, F-61, F-64]
    edit: ["src/fleet_routing/data.py:241"]
    rerun: ["make data", "make run"]
  - id: A-03
    statement: "A misroute is priced at 150 km inside the risk-priced router (cost per stop = 150 km x 0.094 x p(1-p) per position past the first)."
    source: "src/fleet_routing/config.py:90 (MISROUTE_COST_KM = 150.0); README 'The approach'"
    figures: [F-14, F-15, F-23, F-24, F-25, F-26, F-27, F-32, F-33, F-34, F-35, F-36, F-59, F-65, F-66]
    edit: ["src/fleet_routing/config.py:90"]
    rerun: ["make run", "export_dispatch_sheet.py + inject_sheet.py"]
  - id: A-04
    statement: "Each OR-Tools solve is capped at 6 s wall-clock per depot-day (1.5 s on the small profile). Results vary slightly run to run and with machine load."
    source: "src/fleet_routing/config.py:45 (solver_seconds=6.0); routing.py:231; README 'Known limitations'"
    figures: [F-09, F-25, F-26, F-30, F-31, F-35, F-38, F-40, F-57, F-58, F-59, F-60, F-61, F-62, F-63]
    edit: ["src/fleet_routing/config.py:45"]
    rerun: ["make run", "export_dispatch_sheet.py + inject_sheet.py"]
  - id: A-05
    statement: "Distances are straight lines x 1.3 (circuity) at a flat 50 km/h. No road network, traffic or driver breaks."
    source: "src/fleet_routing/config.py:74 (SPEED_KMH = 50.0), :76 (CIRCUITY = 1.3); README 'Known limitations'"
    figures: [F-24, F-26, F-27, F-29, F-30, F-31, F-35, F-36]
    edit: ["src/fleet_routing/config.py:74-76"]
    rerun: ["make run", "export_dispatch_sheet.py + inject_sheet.py"]
  - id: A-06
    statement: "Drivers leave the depot from 06:00 and must be back by 18:00."
    source: "src/fleet_routing/config.py:72-73 (SHIFT_START, SHIFT_END); routing.py:205"
    figures: [F-07, F-36]
    edit: ["src/fleet_routing/config.py:72-73"]
    rerun: ["make run", "export_dispatch_sheet.py + inject_sheet.py"]
  - id: A-07
    statement: "Delivery windows are hard constraints in OR-Tools (it drops a stop rather than arrive late) and are ignored by the sweep baseline, so the on-time comparison is lopsided by design."
    source: "src/fleet_routing/routing.py:205-225; README 'Known limitations'"
    figures: [F-11, F-34]
    edit: ["src/fleet_routing/routing.py"]
    rerun: ["make run"]
  - id: A-08
    statement: "A pre-dispatch call fixes the postcode, address and handwritten-label faults completely; it cannot fix a between-depots zone or a cross-dock relabel."
    source: "src/fleet_routing/risk.py:134-142 (address_check); README 'Known limitations'"
    figures: [F-21]
    edit: ["src/fleet_routing/risk.py:134-142"]
    rerun: ["make run"]
  - id: A-09
    statement: "The dispatch office calls the top 5% of each day's consignees."
    source: "src/fleet_routing/config.py:93 (ADDRESS_CHECK_SHARE = 0.05)"
    figures: [F-21]
    edit: ["src/fleet_routing/config.py:93"]
    rerun: ["make run"]
  - id: A-10
    statement: "Trucks booked per depot-day = ceil(forecast orders x 2.1 pallets/stop x 1.10 headroom / (mean capacity x 0.85 fill)), capped at the depot fleet."
    source: "src/fleet_routing/simulate.py:36-45 (roster_size); config.py:82-84"
    figures: [F-44, F-45, F-32]
    edit: ["src/fleet_routing/config.py:82-84"]
    rerun: ["make run"]
  - id: A-11
    statement: "Fleet mix: 70% tractors with 26 pallets, 30% rigids with 14 pallets; depot fleets 63 / 86 / 47 / 104."
    source: "src/fleet_routing/config.py:67-69; data/full/depots.csv"
    figures: [F-03, F-23, F-25, F-32, F-36]
    edit: ["src/fleet_routing/config.py:67-69"]
    rerun: ["make data", "make run"]
  - id: A-12
    statement: "Evaluation windows: quiet week 2025-10-13..17 and peak week 2025-12-08..12 (orders Mon-Fri, dispatched the next day, leftovers carried, up to 3 clear-out days)."
    source: "src/fleet_routing/config.py:43, :95 (CLEAR_OUT_DAYS = 3)"
    figures: [F-28, F-28, F-29, F-30, F-31, F-38, F-39, F-40]
    edit: ["src/fleet_routing/config.py:43"]
    rerun: ["make run"]
  - id: A-13
    statement: "Forecasts are backtested from 12 weekly (Monday) origins over the last 12 weeks of 2025; every feature is at least a week old."
    source: "src/fleet_routing/config.py:40, :44; forecast.py:166-183"
    figures: [F-10, F-41, F-42, F-43, F-44, F-45]
    edit: ["src/fleet_routing/config.py:44"]
    rerun: ["make run"]
  - id: A-14
    statement: "Router cost terms: a dropped stop costs 1,000 km x (1 + days waited); each truck used costs 40 km."
    source: "src/fleet_routing/routing.py:32 (DROP_PENALTY_KM), :34 (VEHICLE_FIXED_KM)"
    figures: [F-25, F-26, F-30, F-35, F-40]
    edit: ["src/fleet_routing/routing.py:32-34"]
    rerun: ["make run"]
  - id: A-15
    statement: "Video rounding: percentages to 1 decimal, km and counts to whole numbers with thousands separators, WAPE and AUC to 3 decimals; '24k', '200k', '~18 min' are rounded labels."
    source: "this audit (display convention)"
    figures: [F-14, F-15, F-18, F-27, F-31, F-38, F-41, F-42, F-43, F-44, F-45, F-54, F-57, F-58, F-59, F-60, F-61, F-62, F-63, F-64, F-65]
    edit: ["the composition file named on each slide"]
    rerun: ["hyperframes render"]
  - id: A-16
    statement: "Slide 01 (industry, everyday problems) is general logistics knowledge used as context. It is not a result of this repo and carries no numbers."
    source: "author's framing; README 'The problem' supports problems 2-4"
    figures: [F-01, F-02]
    edit: ["compositions/s01-context.html"]
    rerun: ["hyperframes render"]

figures:
  # ---- slide 01
  - {id: F-01, slides: ["01"], label: "Industries that relate: regional freight & 3PL carriers, parcel & retail distribution, grocery & e-commerce fleets", shown: "3 industry chips", type: general-knowledge, source: "author's framing", key: "-", formula: "-", manual: "Context statement, not a repo output."}
  - {id: F-02, slides: ["01"], label: "Four everyday problems (manual routing; windows vs capacity; misroutes cost a second trip; peak outgrows fleet)", shown: "4 problem cards", type: general-knowledge, source: "README 'The problem' (problems 2-4)", key: "README lines 16-27", formula: "-",
     check: {expr: "grep('README.md', r'costs a second delivery') and grep('README.md', r'books too few') and grep('README.md', r'delivery window|delivery windows')", fmt: bool}}
  # ---- slide 02
  - {id: F-03, slides: ["02", "05", "08"], label: "Fleet size", shown: "300 trucks", type: direct, source: "outputs/full/results.json", key: "trucks", formula: "-",
     check: {expr: "J('outputs/full/results.json')['trucks']", fmt: "{:d}", expect: "300"}}
  - {id: F-04, slides: ["02", "08"], label: "Depots", shown: "4 depots", type: direct, source: "outputs/full/results.json", key: "depots", formula: "-",
     check: {expr: "J('outputs/full/results.json')['depots']", fmt: "{:d}", expect: "4"}}
  - {id: F-05, slides: ["02"], label: "Orders on the busiest day", shown: "Up to 2,800 orders a day", type: derived, source: "data/full/dispatch_orders.csv", key: "orders per date (max = 2,785 on 2025-12-08)", formula: "max daily order count = 2,785, rounded up to the nearest hundred = 2,800",
     check: {expr: "(lambda m: 2700 < m <= 2800)(int(R('data/full/dispatch_orders.csv').groupby('date').size().max()))", fmt: bool},
     note: "Peak-week days have 2,622-2,785 orders. The README describes the peak as 'closer to 2,700' a day (an average); the slide states the upper bound."}
  - {id: F-06, slides: ["02"], label: "Every stop has a delivery window", shown: "every stop has a delivery window", type: direct, source: "data/full/dispatch_orders.csv", key: "tw_start, tw_end (no missing values)", formula: "count of missing windows = 0",
     check: {expr: "int(R('data/full/dispatch_orders.csv')[['tw_start','tw_end']].isna().sum().sum()) == 0", fmt: bool}}
  - {id: F-07, slides: ["02"], label: "Trailer capacity and shift limits are constraints", shown: "trailer capacity + shift limits", type: direct, source: "src/fleet_routing/routing.py:202, :205", key: "capacity + time dimensions", formula: "-",
     check: {expr: "grep('src/fleet_routing/routing.py', r'AddDimensionWithVehicleCapacity') and grep('src/fleet_routing/routing.py', r'config.SHIFT_END')", fmt: bool}}
  - {id: F-08, slides: ["02"], label: "Peak misroute base rate", shown: ">5% of peak shipments misrouted", type: direct, source: "outputs/full/risk_scores.csv; README line 26-27", key: "model=xgboost, period=peak, base_rate (0.0531)", formula: "base_rate x 100 = 5.3% > 5%",
     check: {expr: "row('outputs/full/risk_scores.csv', model='xgboost', period='peak')['base_rate'] * 100 > 5", fmt: bool}}
  # ---- slide 03
  - {id: F-09, slides: ["03", "05"], label: "Solver time limit per depot-day", shown: "OR-Tools, 6 s per depot / solve budget 6.0 s", type: direct, source: "outputs/full/results.json", key: "solver_seconds_per_depot_day", formula: "-",
     check: {expr: "J('outputs/full/results.json')['solver_seconds_per_depot_day']", fmt: "{:.1f}", expect: "6.0"}}
  - {id: F-10, slides: ["03"], label: "Forecast and driver booking happen every Monday", shown: "EVERY MONDAY", type: direct, source: "README line 43", key: "README", formula: "-",
     check: {expr: "grep('README.md', r'made every Monday')", fmt: bool}}
  - {id: F-11, slides: ["03"], label: "Routes out: windows kept, fewer km, fewer trucks (risk-priced OR-Tools vs sweep, peak week)", shown: "windows kept / fewer km / fewer trucks", type: derived, source: "outputs/full/routing_summary.csv", key: "arm in {sweep, ortools_risk}, window=peak: on_time_pct, total_km, vehicle_days", formula: "on_time_pct = 100; total_km(ortools_risk) < total_km(sweep); vehicle_days(ortools_risk) < vehicle_days(sweep)",
     check: {expr: "(lambda s, o: o['on_time_pct'] == 100 and o['total_km'] < s['total_km'] and o['vehicle_days'] < s['vehicle_days'])(row('outputs/full/routing_summary.csv', arm='sweep', window='peak'), row('outputs/full/routing_summary.csv', arm='ortools_risk', window='peak'))", fmt: bool}}
  - {id: F-12, slides: ["03"], label: "Optimizer loop: build a first plan, then improve it", shown: "build, score, improve", type: direct, source: "src/fleet_routing/routing.py:229-230", key: "PATH_CHEAPEST_ARC + GUIDED_LOCAL_SEARCH", formula: "-",
     check: {expr: "grep('src/fleet_routing/routing.py', r'PATH_CHEAPEST_ARC') and grep('src/fleet_routing/routing.py', r'GUIDED_LOCAL_SEARCH')", fmt: bool}}
  # ---- slide 04
  - {id: F-13, slides: ["04"], label: "Later stops are riskier (deeper in the trailer)", shown: "Later stops are riskier", type: direct, source: "src/fleet_routing/data.py:238-241; outputs/full/results.json position_effect_logodds_per_stop", key: "0.09 generated, 0.094 estimated", formula: "estimated slope > 0",
     check: {expr: "J('outputs/full/results.json')['position_effect_logodds_per_stop'] > 0", fmt: bool}}
  - {id: F-14, slides: ["04"], label: "Misroute change from pricing risk (peak, vs plain OR-Tools)", shown: "-4.2% misroutes", type: derived, source: "outputs/full/routing_summary.csv", key: "window=peak, misroute_pct: ortools_risk 4.3871, ortools 4.5810", formula: "(4.3871 - 4.5810) / 4.5810 x 100 = -4.23%",
     check: {expr: "(row('outputs/full/routing_summary.csv', arm='ortools_risk', window='peak')['misroute_pct'] / row('outputs/full/routing_summary.csv', arm='ortools', window='peak')['misroute_pct'] - 1) * 100", fmt: "{:+.1f}%", expect: "-4.2%"}}
  - {id: F-15, slides: ["04", "09"], label: "Extra km from pricing risk (peak, vs plain OR-Tools)", shown: "+4.0% km", type: derived, source: "outputs/full/routing_summary.csv", key: "window=peak, total_km: ortools_risk 113,937.7, ortools 109,607.3", formula: "(113,937.7 - 109,607.3) / 109,607.3 x 100 = +3.95%",
     check: {expr: "(row('outputs/full/routing_summary.csv', arm='ortools_risk', window='peak')['total_km'] / row('outputs/full/routing_summary.csv', arm='ortools', window='peak')['total_km'] - 1) * 100", fmt: "{:+.1f}%", expect: "+4.0%"}}
  # ---- slide 05
  - {id: F-16, slides: ["05", "08"], label: "Zone demand history", shown: "2 yrs x 40 zones", type: direct, source: "data/full/zone_demand.csv; outputs/full/results.json zones", key: "731 daily rows 2024-01-01..2025-12-31; zones = 40", formula: "-",
     check: {expr: "len(R('data/full/zone_demand.csv')) == 731 and J('outputs/full/results.json')['zones'] == 40", fmt: bool}}
  - {id: F-17, slides: ["05"], label: "Shipment history size", shown: "200k history", type: direct, source: "data/full/shipments_history.csv", key: "row count", formula: "-",
     check: {expr: "len(R('data/full/shipments_history.csv'))", fmt: "{:,d}", expect: "200,000"}}
  - {id: F-18, slides: ["05"], label: "Dispatch orders (both replayed weeks)", shown: "24k", type: direct, source: "outputs/full/results.json", key: "dispatch_orders = 24,394", formula: "24,394 rounded to thousands",
     check: {expr: "round(J('outputs/full/results.json')['dispatch_orders'] / 1000)", fmt: "{:d}k", expect: "24k"}}
  - {id: F-20, slides: ["05"], label: "Every pipeline box exists in the code", shown: "forecast.py, risk.py, simulate.py, routing.py, replay(), data.py", type: direct, source: "src/fleet_routing/", key: "files + def replay", formula: "-",
     check: {expr: "all(grep('src/fleet_routing/' + f, p) for f, p in [('forecast.py', r'def backtest'), ('risk.py', r'def fit'), ('risk.py', r'def address_check'), ('simulate.py', r'def roster_size'), ('routing.py', r'def ortools_plan'), ('routing.py', r'def replay'), ('data.py', r'def generate')])", fmt: bool}}
  - {id: F-21, slides: ["05"], label: "Share of consignees called", shown: "call top 5% before loading", type: direct, source: "src/fleet_routing/config.py:93", key: "ADDRESS_CHECK_SHARE = 0.05", formula: "-",
     check: {expr: "grep('src/fleet_routing/config.py', r'ADDRESS_CHECK_SHARE = 0.05')", fmt: bool}}
  # ---- slide 06
  - {id: F-22, slides: ["06"], label: "Map: depot and day", shown: "Depot 3 · dispatch 2025-12-09", type: direct, source: "data/full/depots.csv (busiest depot); src/fleet_routing/cli.py:121-125; config peak window", key: "depot with most vehicles = 3; first peak dispatch = 2025-12-08 + 1 day", formula: "-",
     check: {expr: "int(R('data/full/depots.csv').sort_values('vehicles').iloc[-1]['depot']) == 3 and J('demo:assets/dispatch_sheet.json')['dispatch_day'] == '2025-12-09'", fmt: bool}}
