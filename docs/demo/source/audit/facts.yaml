  - {id: F-34, slides: ["07"], label: "Orders inside their delivery windows", shown: "all inside their delivery windows", type: direct, source: "demo assets/dispatch_sheet.json", key: "on_time = delivered = orders", formula: "910 / 910",
     check: {expr: "(lambda d: d['on_time'] == d['delivered'] == d['orders'])(J('demo:assets/dispatch_sheet.json'))", fmt: bool}}
  - {id: F-35, slides: ["07"], label: "Total km on the sheet", shown: "8,413 km", type: direct, source: "demo assets/dispatch_sheet.json", key: "total_km = 8,412.7", formula: "rounded",
