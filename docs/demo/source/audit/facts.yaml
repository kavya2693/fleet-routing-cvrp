  - {id: F-29, slides: ["06", "08", "09"], label: "Sweep road km, peak week", shown: "140,683 km", type: direct, source: "outputs/full/routing_summary.csv", key: "arm=sweep, window=peak, total_km", formula: "-",
     check: {expr: "row('outputs/full/routing_summary.csv', arm='sweep', window='peak')['total_km']", fmt: "{:,.0f}", expect: "140,683"}}
  - {id: F-30, slides: ["06", "08", "09"], label: "OR-Tools road km, peak week", shown: "109,607 km", type: direct, source: "outputs/full/routing_summary.csv", key: "arm=ortools, window=peak, total_km", formula: "-",
     check: {expr: "row('outputs/full/routing_summary.csv', arm='ortools', window='peak')['total_km']", fmt: "{:,.0f}", expect: "109,607"}}
  - {id: F-31, slides: ["06", "08"], label: "Road km change, peak week", shown: "-22.1%", type: derived, source: "outputs/full/routing_summary.csv", key: "F-30 vs F-29", formula: "(109,607.3 - 140,683.4) / 140,683.4 x 100 = -22.09%",
     check: {expr: "(row('outputs/full/routing_summary.csv', arm='ortools', window='peak')['total_km'] / row('outputs/full/routing_summary.csv', arm='sweep', window='peak')['total_km'] - 1) * 100", fmt: "{:+.1f}%", expect: "-22.1%"}}
  # ---- slide 07
  - {id: F-32, slides: ["07"], label: "Trucks on the dispatch sheet", shown: "93 trucks", type: direct, source: "demo assets/dispatch_sheet.json (re-run of the repo's routing for Depot 3, 2025-12-09)", key: "trucks_used (rostered 104)", formula: "-",
